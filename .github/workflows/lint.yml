name: Lint

on:
  # Skip lint/type-check for docs-only changes (a mixed code+docs change still runs).
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'mkdocs.yml'
  # Run on every PR regardless of base so stacked/epic PRs get their own CI.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'mkdocs.yml'

# Cancel superseded runs on the same ref for fast feedback.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Ruff lint
        run: uvx ruff check --output-format=github .

      - name: Ruff format check
        run: uvx ruff format --check .

  ty:
    name: ty (type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # Sync deps first so ty can resolve third-party imports (numpy, pandas,
      # mne, ...); without an environment it reports spurious unresolved-import.
      - name: Install dependencies
        run: uv sync --extra dev

      # Type checking is a BLOCKING gate on the package source (#43). The
      # [tool.ty.src] config in pyproject excludes biosigio/tests from the gate
      # (tests are exercised by running them); ty reports zero on the source.
      - name: ty check
        run: uv run ty check biosigio
