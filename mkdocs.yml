site_name: biosigIO Documentation
site_description: Documentation for biosigIO - biosignal (EEG/EMG/iEEG/MEG) import/export and manipulation
site_author: Seyed (Yahya) Shirazi
repo_url: https://github.com/neuromechanist/biosigio
repo_name: neuromechanist/biosigio

theme:
  name: material
  palette:
    - primary: custom
    - accent: custom
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
  

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
  - mkdocs-jupyter

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide:
    - Installation: user-guide/installation.md
    - Basic Usage: user-guide/basic-usage.md
    - Channel Selection: user-guide/channel-selection.md
    - EDF/BDF Format Selection: user-guide/edf-bdf-selection.md
    - Metadata Handling: user-guide/metadata.md
    - Signal Verification: user-guide/verification.md
  - Data Formats:
    - Trigno: formats/trigno.md
    - EEGLAB: formats/eeglab.md
    - OTB: formats/otb.md
    - EDF: formats/edf.md
    - CSV: formats/csv.md
    - WFDB: formats/wfdb.md
    - XDF: formats/xdf.md
    - MEG (.fif / CTF .ds / KIT / 4D-BTi): formats/meg.md
    - BrainVision: formats/brainvision.md
    - MEF3 (.mefd): formats/mef3.md
    - Proprietary electrophysiology (Neo): formats/neo.md
  - Serialization & Serving:
    - Overview (Parquet/Arrow/Zarr): formats/serialization.md
    - Zarr Serving Store: formats/zarr.md
  - API Reference:
    - Recording Class: api/emg.md
    - Command-Line Interface: api/cli.md
    - Modality Vocabulary: api/core/modality.md
    - BIDS Helpers: api/bids.md
    - Serialization Schema: api/tabular_schema.md
    - Importers:
      - Base Importer: api/importers/base.md
      - Trigno Importer: api/importers/trigno.md
      - EEGLAB Importer: api/importers/eeglab.md
      - OTB Importer: api/importers/otb.md
      - EDF Importer: api/importers/edf.md
      - CSV Importer: api/importers/csv.md
      - WFDB Importer: api/importers/wfdb.md
      - XDF Importer: api/importers/xdf.md
      - MEG Importer: api/importers/meg.md
      - BrainVision Importer: api/importers/brainvision.md
      - MEF3 Importer: api/importers/mef3.md
      - Neo Importer: api/importers/neo.md
      - Tabular Importer (Parquet/Arrow): api/importers/tabular.md
      - Zarr Importer: api/importers/zarr.md
    - Exporters:
      - EDF/BDF Exporter: api/exporters/edf.md
      - Tabular Exporter (Parquet/Arrow): api/exporters/tabular.md
      - Zarr Exporter: api/exporters/zarr.md
    - Analysis:
      - Verification: api/analysis/verification.md
      - Signal Analysis: api/analysis/signal.md
    - Visualization:
      - Static Plots: api/visualization/static.md
  - Examples:
    - Trigno Examples: examples/trigno.md
    - EEGLAB Examples: examples/eeglab.md
    - OTB Examples: examples/otb.md
    - Signal Verification: examples/verification.md
    - Converting Jupyter Notebooks: examples/notebooks.md
    - WFDB Example: examples/wfdb.md
    - XDF Example: examples/xdf.md
    - Serialization Round-Trip: examples/serialization.md
  - Contributing: contributing.md

extra:
  version:
    provider: mike
    default: latest 